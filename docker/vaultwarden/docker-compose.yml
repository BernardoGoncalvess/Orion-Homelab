services:
  vaultwarden:
    image: vaultwarden/server
    container_name: vaultwarden
    restart: always
    ports:
      - "8181:80"
    volumes:
      - vaultwarden_data:/data
    environment:
      # Only set to true temporarily while creating accounts.
      - SIGNUPS_ALLOWED=false

volumes:
  vaultwarden_data:
